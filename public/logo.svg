<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <title>Lazo logo</title>
  <desc>Wordmark "lazo." in Fraunces serif + asymmetric single-stroke knot symbol.</desc>

  <!-- Lazo symbol: continuous asymmetric knot -->
  <g transform="translate(80, 100)" fill="none" stroke="#C97B5A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -55,0 C -55,-28 -18,-28 0,0 C 18,28 55,28 55,0 C 55,-28 18,-28 0,0 C -18,28 -55,28 -55,0" />
  </g>

  <!-- Wordmark -->
  <text x="180" y="138"
        font-family="'Fraunces', 'Times New Roman', Georgia, serif"
        font-size="120"
        font-weight="400"
        fill="#3F5648"
        letter-spacing="-2">lazo.</text>
</svg>
